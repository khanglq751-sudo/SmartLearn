    </aside>


    <main class="main-content">

        <section class="page-header">

            <p class="small-title">
                🧠 SmartLearn
            </p>

            <h1>Flashcard</h1>

            <p>
                Ôn lại kiến thức nhanh chóng.
            </p>

        </section>


        <section class="flashcard-page">

            <div class="flashcard-main">

                <p id="flashcardSubject">
                    📚 Toán
                </p>

                <h2 id="flashcardQuestion">
                    Đang tải...
                </h2>

                <div
                    id="flashcardAnswer"
                    class="flashcard-answer">

                </div>


                <button
                    id="showFlashcardAnswer"
                    class="learn-button">

                    Xem đáp án

                </button>


                <div
                    id="flashcardRating"
                    class="flashcard-rating">

                    <p>
                        Bạn nhớ câu này như thế nào?
                    </p>

                    <button
                        class="rating-btn"
                        data-level="forgot">

                        😵 Quên

                    </button>

                    <button
                        class="rating-btn"
                        data-level="hard">

                        😐 Khó

                    </button>

                    <button
                        class="rating-btn"
                        data-level="easy">

                        😎 Dễ

                    </button>

                </div>


                <button
                    id="nextFlashcard"
                    class="next-flashcard">

                    Câu tiếp theo →

                </button>

            </div>

        </section>

    </main>

</div>
