<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <title>Lịch sử học tập - SmartLearn</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        🧠 SmartLearn
    </div>

    <div class="top-actions">

        <a href="../index.html">
            🏠 Trang chủ
        </a>

    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <h2>📚 Môn học</h2>

        <a href="math.html">📐 Toán</a>
        <a href="informatics.html">💻 Tin học</a>
        <a href="english.html">🇬🇧 Tiếng Anh</a>

        <hr>

        <h2>📊 Học tập</h2>

        <a href="progress.html">
            📊 Tiến trình
        </a>

        <a href="history.html">
            📜 Lịch sử
        </a>

    </aside>


    <main class="main-content">

        <section class="page-header">

            <p class="small-title">
                📜 SmartLearn
            </p>

            <h1>Lịch sử học tập</h1>

            <p>
                Những hoạt động học tập gần đây.
            </p>

        </section>


        <section class="analysis-card">

            <div id="historyList">
                Đang tải...
            </div>

        </section>

    </main>

</div>


<script>

let history = JSON.parse(
    localStorage.getItem("history")
) || [];

const list =
    document.getElementById("historyList");


if (history.length === 0) {

    list.innerHTML =
        "<p>Chưa có lịch sử học tập.</p>";

} else {

    history
        .slice()
        .reverse()
        .forEach(function(item) {

            const div =
                document.createElement("div");

            div.className =
                "history-item";

            div.textContent =
                (item.correct ? "✅ " : "❌ ") +
                item.subject +
                " - " +
                item.topic +
                " • " +
                item.time;

            list.appendChild(div);

        });
}

</script>

</body>

</html>
